# Production-style stack. Before first run:
#   cp .env.production.example .env
#   Fill in JWT_SECRET, POSTGRES_PASSWORD, APP_URL
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: skillfort-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skillfort}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skillfort_lms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - skillfort_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillfort} -d ${POSTGRES_DB:-skillfort_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: skillfort-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillfort}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-skillfort_lms}
    volumes:
      - skillfort_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  skillfort_pg_data:
  skillfort_uploads:
